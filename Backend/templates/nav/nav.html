<button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>
<div class="nav-backdrop" id="nav-backdrop"></div>
<nav class="sidebar" id="sidebar">
    <h2 class="brand">AquaCommunica</h2>
    <ul class="nav-list">
        <li class="nav-label">Overview</li>
        <li><a href="{% url 'dashboard' %}"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Dashboard</span></a></li>
        <li class="nav-label" id="manage-label" hidden>Management</li>
        <li id="customer-link" hidden><a href="{% url 'customer_page' %}"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Customer</span></a></li>
        <li id="user-link" hidden><a href="{% url 'user_page' %}"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Users</span></a></li>
        <li id="dealer-link" hidden><a href="{% url 'dealer_page' %}"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg><span>Dealer</span></a></li>
        <li class="nav-label" id="system-label" hidden>System</li>
        <li id="audit-log-link" hidden><a href="{% url 'audit_log_page' %}"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span>Audit Log</span></a></li>
    </ul>
    <div class="sidebar-bottom">
        <div class="user-info" style="display: flex; align-items: center; gap: 8px; padding-left: 12px;">
            <svg width="40" height="40" viewBox="0 0 40 40" style="flex-shrink: 0; border-radius: 50%; background: rgba(255,255,255,0.3);" aria-hidden="true">
                <circle cx="20" cy="15" r="7" fill="rgba(255,255,255,0.85)"/>
                <path d="M6 40c0-8 6-14 14-14s14 6 14 14z" fill="rgba(255,255,255,0.85)"/>
            </svg>
            <div id="user-email" style="padding: 10px 12px 10px 0; font-size: .9rem; opacity: .85; overflow-wrap: anywhere; min-width: 0;"></div>
        </div>
        <a href="#" id="logout-btn">Logout</a>
    </div>
</nav>

<style>
.sidebar {
    background: linear-gradient(180deg, #087f8c 0%, #05545e 100%);
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
}
.sidebar .brand {
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);
    letter-spacing: .5px;
}
.nav-list { gap: 4px; }
.nav-label {
    margin: 14px 0 4px;
    padding: 0 12px;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .6;
}
.nav-label:first-child { margin-top: 0; }
.nav-label:not(:first-child)::before {
    content: "";
    display: block;
    height: 1px;
    margin: 0 -12px 12px;
    background: rgba(255, 255, 255, 0.2);
}
.sidebar .nav-list a {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    transition: background .2s ease, transform .2s ease;
}
.sidebar .nav-list a:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateX(3px);
}
.sidebar .nav-list a.active {
    background: rgba(255, 255, 255, 0.25);
    font-weight: 600;
}
.sidebar .nav-list a.active::before {
    content: "";
    position: absolute;
    left: -20px;
    top: 8px;
    bottom: 8px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: #fff;
}
.nav-icon { flex-shrink: 0; opacity: .9; }
.nav-toggle, .nav-backdrop { display: none; }
@media (max-width: 768px) {
    body { padding-left: 0 !important; padding-top: 56px; }
    .nav-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 1100;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 8px;
        background: #087f8c;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .sidebar {
        position: fixed !important;
        width: 240px !important;
        max-width: 80vw;
        z-index: 1050;
        transform: translateX(-100%);
        transition: transform .25s ease;
        padding-top: 64px;
    }
    body.nav-open .sidebar { transform: translateX(0); }
    .nav-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 1040;
        background: rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s ease;
    }
    body.nav-open .nav-backdrop { opacity: 1; pointer-events: auto; }
    /* no hover on touch devices: keep logout reachable */
    .sidebar .sidebar-bottom #logout-btn { max-height: 44px; padding-top: 10px; padding-bottom: 10px; opacity: 1; transform: none; }
}
#logout-btn {
    text-align: center;
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateY(12px);
    transition: max-height .25s ease, padding .25s ease, opacity .25s ease, transform .25s ease;
}
.sidebar-bottom:hover #logout-btn,
#logout-btn:hover,
#logout-btn:focus {
    max-height: 44px;
    padding-top: 10px;
    padding-bottom: 10px;
    opacity: 1;
    transform: translateY(0);
}
</style>

<script>
try {
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    const emailEl = document.getElementById("user-email");
    emailEl.textContent = user.email || "";
    if (user.role) {
        const roleEl = document.createElement("div");
        roleEl.textContent = user.role;
        roleEl.style.cssText = "font-size: .8rem; font-weight: bold; opacity: .7; text-transform: capitalize;";
        emailEl.appendChild(roleEl);
    }
    if (user.role === "superadmin" || user.role === "dealer") {
        document.getElementById("customer-link").hidden = false;
        document.getElementById("user-link").hidden = false;
        document.getElementById("manage-label").hidden = false;
    }
    if (user.role === "superadmin") {
        document.getElementById("dealer-link").hidden = false;
        document.getElementById("audit-log-link").hidden = false;
        document.getElementById("system-label").hidden = false;
    }
} catch (_) {}

document.querySelectorAll(".nav-list a").forEach((a) => {
    if (a.pathname === window.location.pathname) a.classList.add("active");
});

(() => {
    const toggle = document.getElementById("nav-toggle");
    const setOpen = (open) => {
        document.body.classList.toggle("nav-open", open);
        toggle.setAttribute("aria-expanded", open);
    };
    toggle.addEventListener("click", () => setOpen(!document.body.classList.contains("nav-open")));
    document.getElementById("nav-backdrop").addEventListener("click", () => setOpen(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
    document.querySelectorAll(".nav-list a").forEach((a) => a.addEventListener("click", () => setOpen(false)));
})();

document.getElementById("logout-btn").addEventListener("click", async (e) => {
    e.preventDefault();
    const access = localStorage.getItem("access_token");
    const refresh = localStorage.getItem("refresh_token");
    try {
        await fetch("{% url 'logout' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + access,
            },
            body: JSON.stringify({ refresh }),
        });
    } catch (_) { /* clear local session regardless */ }
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");
    localStorage.removeItem("user");
    window.location.href = "{% url 'login_page' %}";
});
</script>
