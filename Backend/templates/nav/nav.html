.cp-actions button[type=submit] { background: #087f8c; color: #fff; }

</style>

<script>
try {
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    const emailEl = document.getElementById("user-email");
    emailEl.textContent = user.email || "";
    if (user.role) {
        const roleEl = document.createElement("div");
        roleEl.textContent = user.role;
        roleEl.style.cssText = "font-size: .8rem; font-weight: bold; opacity: .7; text-transform: capitalize;";
        emailEl.appendChild(roleEl);
    }
    if (user.role === "superadmin" || user.role === "dealer") {
        document.getElementById("customer-link").hidden = false;
    }
    if (["superadmin", "user_admin", "executive", "dealer"].includes(user.role)) {
        document.getElementById("user-link").hidden = false;
        document.getElementById("device-link").hidden = false;
        document.getElementById("manage-label").hidden = false;
    }
    if (user.role === "superadmin") {
        document.getElementById("dealer-link").hidden = false;
        document.getElementById("audit-log-link").hidden = false;
        document.getElementById("system-label").hidden = false;
    }
} catch (_) {}

document.querySelectorAll(".nav-list a").forEach((a) => {
    if (a.id !== "change-password-link" && a.pathname === window.location.pathname) a.classList.add("active");
});

(() => {
    const toggle = document.getElementById("nav-toggle");
    const setOpen = (open) => {
        document.body.classList.toggle("nav-open", open);
        toggle.setAttribute("aria-expanded", open);
    };
    toggle.addEventListener("click", () => setOpen(!document.body.classList.contains("nav-open")));
    document.getElementById("nav-backdrop").addEventListener("click", () => setOpen(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
    document.querySelectorAll(".nav-list a").forEach((a) => a.addEventListener("click", () => setOpen(false)));
})();

(() => {
    const overlay = document.getElementById("cp-overlay");
    const form = document.getElementById("cp-form");
    const msg = document.getElementById("cp-msg");
    const submit = document.getElementById("cp-submit");
    const show = (text, ok) => { msg.textContent = text; msg.classList.toggle("ok", !!ok); };
    const hint = document.getElementById("cp-hint");
    const pwNew = document.getElementById("cp-new");
    const pwConfirm = document.getElementById("cp-confirm");
    const checkMatch = () => {
        pwConfirm.classList.remove("pw-ok", "pw-bad");
        hint.className = "cp-hint";
        if (!pwNew.value && !pwConfirm.value) { hint.textContent = ""; return; }
        if (pwNew.value.length < 6) { hint.textContent = "New password must be at least 6 characters."; hint.classList.add("bad"); return; }
        if (!pwConfirm.value) { hint.textContent = ""; return; }
        const ok = pwNew.value === pwConfirm.value;
        pwConfirm.classList.add(ok ? "pw-ok" : "pw-bad");
        hint.textContent = ok ? "\u2713 Passwords match" : "\u2717 Passwords do not match";
        hint.classList.add(ok ? "ok" : "bad");
    };
    pwNew.addEventListener("input", checkMatch);
    pwConfirm.addEventListener("input", checkMatch);
    const setEye = (btn, show) => {
        btn.parentElement.querySelector("input").type = show ? "text" : "password";
        btn.querySelector(".eye-on").hidden = show;
        btn.querySelector(".eye-off").hidden = !show;
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        btn.title = show ? "Hide password" : "Show password";
    };
    form.querySelectorAll(".cp-eye").forEach((btn) => btn.addEventListener("click", () => {
        setEye(btn, btn.parentElement.querySelector("input").type === "password");
    }));
    const close = () => {
        overlay.hidden = true; form.reset(); show("");
        form.querySelectorAll(".cp-eye").forEach((b) => setEye(b, false));
        checkMatch();
    };

    document.getElementById("change-password-link").addEventListener("click", (e) => {
        e.preventDefault();
        overlay.hidden = false;
        document.getElementById("cp-current").focus();
    });
    document.getElementById("cp-cancel").addEventListener("click", close);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !overlay.hidden) close(); });

    const flatten = (d) => {
        if (!d) return "";
        if (typeof d === "string") return d;
        if (Array.isArray(d)) return d.map(flatten).join(" ");
        if (typeof d === "object") return Object.values(d).map(flatten).join(" ");
        return String(d);
    };

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const current_password = document.getElementById("cp-current").value;
        const new_password = document.getElementById("cp-new").value;
        const confirm_password = document.getElementById("cp-confirm").value;
        if (!current_password || !new_password || !confirm_password) return show("All fields are required.");
        if (new_password.length < 6) return show("New password must be at least 6 characters.");
        if (new_password !== confirm_password) return show("New passwords do not match.");
        submit.disabled = true;
        show("");
        try {
            const res = await fetch("{% url 'change_password' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("access_token"),
                },
                body: JSON.stringify({ current_password, new_password, confirm_password }),
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                show(data.message || "Password changed successfully.", true);
                setTimeout(close, 1200);
            } else {
                show(flatten(data.errors || data.message || data.detail || data) || "Could not change password.");
            }
        } catch (_) {
            show("Network error. Please try again.");
        } finally {
            submit.disabled = false;
        }
    });
})();

document.getElementById("logout-btn").addEventListener("click", async (e) => {
    e.preventDefault();
    const access = localStorage.getItem("access_token");
    const refresh = localStorage.getItem("refresh_token");
    try {
        await fetch("{% url 'logout' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + access,
            },
            body: JSON.stringify({ refresh }),
        });
    } catch (_) { /* clear local session regardless */ }
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");
    localStorage.removeItem("user");
    window.location.href = "{% url 'login_page' %}";
});
</script>
