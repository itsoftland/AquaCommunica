{% extends "base.html" %}
{% block title %}Dealer | AquaCommunica{% endblock %}

{% block content %}
<style id="auth-guard-style">body { visibility: hidden; }</style>
<script>
(async () => {
    const toLogin = () => {
        ["access_token", "refresh_token", "user"].forEach(k => localStorage.removeItem(k));
        window.location.replace("{% url 'login_page' %}");
    };
    const profile = (token) => fetch("{% url 'user_profile' %}", {
        headers: { "Authorization": "Bearer " + token },
    });

    const access  = localStorage.getItem("access_token");
    const refresh = localStorage.getItem("refresh_token");
    if (!access || !refresh) return toLogin();

    try {
        let res = await profile(access);
        if (res.status === 401) {
            const r = await fetch("{% url 'token_refresh' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ refresh }),
            });
            const body = await r.json().catch(() => ({}));
            const newAccess = body.access || (body.data && body.data.access);
            if (!r.ok || !newAccess) return toLogin();
            localStorage.setItem("access_token", newAccess);
            res = await profile(newAccess);
        }
        if (!res.ok) return toLogin();
        const body = await res.json();
        // only super admins may view this page
        if (body.data.user.role !== "superadmin") {
            return window.location.replace("{% url 'dashboard' %}");
        }
    } catch (_) {
        return toLogin();
    }
    document.getElementById("auth-guard-style").remove();
    loadDealers();
})();

const SVG_ATTRS = 'width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICON_VIEW = `<svg ${SVG_ATTRS}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_EDIT = `<svg ${SVG_ATTRS}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`;

const LIST_URL = "{% url 'get_dealer_profile_list' %}";
let currentUrl = LIST_URL;
let prevUrl = null, nextUrl = null, pageSize = 0;

async function loadDealers(url = currentUrl) {
    const body = document.getElementById("dealer-body");
    const cols = 10;
    const message = (text) => {
        body.innerHTML = "";
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = cols;
        td.textContent = text;
        tr.appendChild(td);
        body.appendChild(tr);
    };

    let res, json;
    try {
        res = await fetch(url, {
            headers: { "Authorization": "Bearer " + localStorage.getItem("access_token") },
        });
        json = await res.json().catch(() => ({}));
    } catch (_) {
        return message("Network error. Please try again.");
    }
    if (!res.ok) return message(json.message || "Unable to load dealers.");

    const rows = (json.data && json.data.results) || [];
    currentUrl = url;
    prevUrl = json.data.previous;
    nextUrl = json.data.next;
    const page = Number(new URL(url, location.href).searchParams.get("page")) || 1;
    // the backend decides the page size; the first page is always full when more pages exist
    const sizeParam = Number(new URL(url, location.href).searchParams.get("page_size"));
    if (sizeParam) pageSize = sizeParam;
    else if (page === 1) pageSize = rows.length || pageSize;
    const pages = Math.max(1, Math.ceil(json.data.count / (pageSize || 1)));
    document.getElementById("pager-info").textContent = page + " / " + pages;
    document.getElementById("pager-prev").disabled = !prevUrl;
    document.getElementById("pager-next").disabled = !nextUrl;
    if (!rows.length) return message("No dealers yet.");

    body.innerHTML = "";
    for (const p of rows) {
        const tr = document.createElement("tr");
        [
            p.profile_id,
            [p.first_name, p.last_name].filter(Boolean).join(" "),
            p.user_email,
            p.city,
            p.total_device_count,
            p.validity_from_date,
            p.validity_to_date,
            p.authentication_status,
            p.is_profile_active ? "Active" : "Inactive",
        ].forEach(v => {
            const td = document.createElement("td");
            td.textContent = (v === null || v === undefined || v === "") ? "-" : v;
            tr.appendChild(td);
        });
        const statusCell = tr.lastElementChild;
        const badge = document.createElement("span");
        badge.className = "badge " + (p.is_profile_active ? "badge-green" : "badge-red");
        badge.textContent = statusCell.textContent;
        statusCell.textContent = "";
        statusCell.appendChild(badge);
        const actions = document.createElement("td");
        [["View", "view", ICON_VIEW], ["Update", "edit", ICON_EDIT]].forEach(([label, mode, icon]) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "icon-btn";
            btn.title = label;
            btn.setAttribute("aria-label", label + " dealer");
            btn.innerHTML = icon;
            btn.addEventListener("click", () => openDealer(p.id, mode));
            actions.appendChild(btn);
        });
        tr.appendChild(actions);
        body.appendChild(tr);
    }
}

const DETAIL_URL = "{% url 'dealer_profile_details' 0 %}";
const UPDATE_URL = "{% url 'update_dealer_profile' 0 %}";
const authHeaders = () => ({ "Authorization": "Bearer " + localStorage.getItem("access_token") });
const EDIT_FIELDS = [
    ["first_name", "First Name"], ["last_name", "Last Name"],
    ["phone_number", "Phone Number"], ["contact_email", "Contact Email"],
    ["address", "Address"], ["city", "City"], ["state", "State"],
    ["pincode", "Pincode"], ["gst_number", "GST Number"],
];
const VIEW_FIELDS = [
    ["profile_id", "Profile ID"], ["user_email", "Login Email"],
    ...EDIT_FIELDS,
    ["authentication_status", "Authentication"], ["is_profile_active", "Active"],
    ["validity_from_date", "Valid From"], ["validity_to_date", "Valid Till"],
    ["total_licence_unit", "Licence Units"], ["total_user_count", "Users"],
    ["parent_user_count", "Parent Users"], ["child_user_count", "Child Users"],
    ["total_device_count", "Devices"],
    ["created_at", "Created At"], ["updated_at", "Updated At"],
];

const CREATE_USER_URL = "{% url 'user_registration' %}";

function flattenErrors(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "string") return v;
    if (Array.isArray(v)) return v.map(flattenErrors).join(" ");
    if (typeof v === "object") {
        return Object.entries(v).map(([k, x]) => k + ": " + flattenErrors(x)).join("; ");
    }
    return String(v);
}

function openCreateModal() {
    document.getElementById("create-form").reset();
    document.getElementById("create-error").textContent = "";
    document.getElementById("create-modal").hidden = false;
}
function closeCreateModal() { document.getElementById("create-modal").hidden = true; }

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("create-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const err = document.getElementById("create-error");
        const submit = document.getElementById("create-submit");
        err.textContent = "";
        if (!f.reportValidity()) return;
        submit.disabled = true;
        try {
            const res = await fetch(CREATE_USER_URL, {
                method: "POST",
                headers: { ...authHeaders(), "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: f.email.value.trim(),
                    password: f.password.value,
                    password_confirm: f.password_confirm.value,
                    role: "dealer",
                }),
            });
            const json = await res.json().catch(() => ({}));
            if (!res.ok) {
                err.textContent = flattenErrors(json.data || json.message || json) || "Unable to create dealer.";
            } else {
                closeCreateModal();
                loadDealers();
            }
        } catch (_) {
            err.textContent = "Network error. Please try again.";
        }
        submit.disabled = false;
    });
});

function closeModal() { document.getElementById("dealer-modal").hidden = true; }

async function openDealer(id, mode) {
    const modal = document.getElementById("dealer-modal");
    const content = document.getElementById("modal-content");
    const title = document.getElementById("modal-title");
    title.textContent = mode === "edit" ? "Update Dealer" : "Dealer Details";
    content.textContent = "Loading...";
    modal.hidden = false;

    let res, json;
    try {
        res = await fetch(DETAIL_URL.replace(/0\/$/, id + "/"), { headers: authHeaders() });
        json = await res.json().catch(() => ({}));
    } catch (_) {
        content.textContent = "Network error. Please try again.";
        return;
    }
    if (!res.ok) { content.textContent = json.message || "Unable to load dealer."; return; }
    const d = json.data;
    content.textContent = "";

    if (mode === "view") {
        const dl = document.createElement("dl");
        dl.className = "detail-grid";
        VIEW_FIELDS.forEach(([key, label]) => {
            const v = d[key];
            const dt = document.createElement("dt");
            dt.textContent = label;
            const dd = document.createElement("dd");
            dd.textContent = (v === null || v === undefined || v === "") ? "-" : (typeof v === "boolean" ? (v ? "Yes" : "No") : v);
            dl.append(dt, dd);
        });
        content.appendChild(dl);
        return;
    }

    const form = document.createElement("form");
    form.className = "edit-form";
    EDIT_FIELDS.forEach(([key, label]) => {
        const lab = document.createElement("label");
        lab.textContent = label;
        const input = document.createElement("input");
        input.name = key;
        input.value = d[key] ?? "";
        lab.appendChild(input);
        form.appendChild(lab);
    });
    const err = document.createElement("div");
    err.className = "form-error";
    const save = document.createElement("button");
    save.type = "submit";
    save.className = "btn-action btn-edit";
    save.textContent = "Save";
    form.append(err, save);
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        save.disabled = true;
        const payload = Object.fromEntries(new FormData(form).entries());
        try {
            const r = await fetch(UPDATE_URL.replace(/0\/update\/$/, id + "/update/"), {
                method: "PATCH",
                headers: { ...authHeaders(), "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) {
                const detail = j.errors || j.data;
                err.textContent = (j.message || "Update failed.") +
                    (detail && typeof detail === "object" ? " " + JSON.stringify(detail) : "");
                save.disabled = false;
                return;
            }
            closeModal();
            loadDealers();
        } catch (_) {
            err.textContent = "Network error. Please try again.";
            save.disabled = false;
        }
    });
    content.appendChild(form);
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); closeCreateModal(); } });
</script>

{% include "nav/nav.html" %}
<div class="customer-page">
    <div class="page-head">
        <h1>Dealers</h1>
        <button type="button" class="btn-action btn-create" onclick="openCreateModal()">+ Create Dealer</button>
    </div>
    <div class="customer-table-wrap">
        <table class="customer-table">
            <thead>
                <tr>
                    <th>Profile ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Devices</th>
                    <th>Valid From</th>
                    <th>Valid Till</th>
                    <th>Authentication</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="dealer-body"><tr><td colspan="10">Loading...</td></tr></tbody>
        </table>
    </div>
    <div class="pager">
        <button type="button" id="pager-prev" class="icon-btn" onclick="loadDealers(prevUrl)" title="Previous" aria-label="Previous page" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span id="pager-info"></span>
        <button type="button" id="pager-next" class="icon-btn" onclick="loadDealers(nextUrl)" title="Next" aria-label="Next page" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
</div>
<div id="dealer-modal" class="modal-backdrop" hidden onclick="if (event.target === this) closeModal()">
    <div class="modal-box">
        <div class="modal-head">
            <h2 id="modal-title"></h2>
            <button type="button" class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
        </div>
        <div id="modal-content"></div>
    </div>
</div>
<div id="create-modal" class="modal-backdrop" hidden onclick="if (event.target === this) closeCreateModal()">
    <div class="modal-box">
        <div class="modal-head">
            <h2>Create Dealer</h2>
            <button type="button" class="modal-close" onclick="closeCreateModal()" aria-label="Close">&times;</button>
        </div>
        <form id="create-form" class="edit-form create-form" novalidate>
            <label>Email<input type="email" name="email" required autocomplete="off"></label>
            <label>Password<input type="password" name="password" minlength="6" required autocomplete="new-password"></label>
            <label>Confirm Password<input type="password" name="password_confirm" required autocomplete="new-password"></label>
            <div class="form-error" id="create-error"></div>
            <button type="submit" class="btn-action btn-edit" id="create-submit">Create</button>
        </form>
    </div>
</div>
<style>
.btn-create { background: #087f8c; padding: 8px 16px; font-size: .9rem; }
.create-form { grid-template-columns: 1fr; }
.pager { display: flex; justify-content: center; align-items: center; color: #52606d; font-size: .9rem; gap: 12px; margin-top: 12px; }
.icon-btn { border: none; background: none; color: #087f8c; padding: 4px; border-radius: 6px; cursor: pointer; line-height: 0; vertical-align: middle; }
.icon-btn + .icon-btn { margin-left: 6px; }
.icon-btn:hover { background: #e6f4f5; }
.icon-btn:disabled { color: #b8c2cc; cursor: default; background: none; }
.btn-action { border: 0; border-radius: 4px; padding: 4px 10px; font-size: .8rem; font-weight: 600; color: #fff; cursor: pointer; }
.btn-edit { background: #1a7f45; }
.btn-action:disabled { opacity: .6; cursor: default; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-backdrop[hidden] { display: none; }
.modal-box { background: #fff; border-radius: 8px; width: min(640px, 92vw); max-height: 90vh; overflow-y: auto; padding: 20px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-head h2 { margin: 0; font-size: 1.25rem; color: #1f2933; }
.modal-close { background: none; border: 0; font-size: 1.6rem; cursor: pointer; color: #52606d; }
.detail-grid { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; margin: 0; }
.detail-grid dt { font-weight: 600; color: #52606d; }
.detail-grid dd { margin: 0; color: #1f2933; word-break: break-word; }
.edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.edit-form label { display: flex; flex-direction: column; font-size: .85rem; font-weight: 600; color: #52606d; gap: 4px; }
.edit-form input { padding: 7px 8px; border: 1px solid #cbd2d9; border-radius: 4px; font-size: .9rem; }
.form-error { grid-column: 1 / -1; color: #b42318; font-size: .85rem; }
.edit-form .btn-action { grid-column: 1 / -1; justify-self: start; padding: 8px 18px; }
.customer-page { max-width: 100%; }
.customer-page h1 { margin: 0; font-size: 1.6rem; color: #1f2933; }
.page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.customer-table-wrap { width: 100%; overflow: auto; max-height: calc(100vh - 210px); background: #fff; border: 1px solid #e3e8ef; border-radius: 8px; scrollbar-width: thin; scrollbar-color: #b8c2cc transparent; }
.customer-table-wrap::-webkit-scrollbar { height: 6px; }
.customer-table-wrap::-webkit-scrollbar-thumb { background: #b8c2cc; border-radius: 3px; }
.customer-table-wrap::-webkit-scrollbar-track { background: transparent; }
.customer-table { width: 100%; border-collapse: collapse; table-layout: auto; }
.customer-table th { position: sticky; top: 0; z-index: 1; text-align: left; background: #087f8c; color: #fff; padding: 10px 12px; white-space: nowrap; font-weight: 600; }
.customer-table td { padding: 10px 12px; border-bottom: 1px solid #eef1f5; vertical-align: top; color: #1f2933; white-space: nowrap; }
.customer-table tbody tr:hover { background: #f6f9fb; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .75rem; font-weight: 600; text-transform: uppercase; background: #eef1f5; color: #52606d; }
.badge-green { background: #e6f6ec; color: #1a7f45; }
.badge-red { background: #fdecec; color: #b42318; }
@media (max-width: 768px) {
    body { padding-left: 0; }
    .page-head { flex-wrap: wrap; gap: 10px; }
    .modal { padding: 16px; max-height: 92vh; }
    .modal .customer-table { display: block; overflow-x: auto; }
    .edit-form { grid-template-columns: 1fr; }
    .modal-actions { flex-wrap: wrap; }
}
</style>
{% endblock %}
