{% extends "base.html" %}
{% block title %}Devices | AquaCommunica{% endblock %}

{% block content %}
<style id="auth-guard-style">body { visibility: hidden; }.dev-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.dev-filters input, .dev-filters select { padding: 8px 10px; border: 1px solid #c9d3de; border-radius: 8px; background: #fff; font-size: .9rem; }
.dev-filters input { min-width: 200px; flex: 1; }
.dev-filters button { padding: 8px 16px; border-radius: 8px; border: 1px solid #5b5bd6; background: #fff; color: #5b5bd6; font-weight: 600; cursor: pointer; }
.dev-filters button[type=submit] { background: linear-gradient(135deg, #0ea5a4, #5b5bd6); border-color: transparent; color: #fff; }
</style>
<script>
(async () => {
    const toLogin = () => {
        ["access_token", "refresh_token", "user"].forEach(k => localStorage.removeItem(k));
        window.location.replace("{% url 'login_page' %}");
    };
    const profile = (token) => fetch("{% url 'user_profile' %}", {
        headers: { "Authorization": "Bearer " + token },
    });

    const access  = localStorage.getItem("access_token");
    const refresh = localStorage.getItem("refresh_token");
    if (!access || !refresh) return toLogin();

    try {
        let res = await profile(access);
        if (res.status === 401) {
            const r = await fetch("{% url 'token_refresh' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ refresh }),
            });
            const body = await r.json().catch(() => ({}));
            const newAccess = body.access || (body.data && body.data.access);
            if (!r.ok || !newAccess) return toLogin();
            localStorage.setItem("access_token", newAccess);
            res = await profile(newAccess);
        }
        if (!res.ok) return toLogin();
        const body = await res.json();
        if (!["superadmin", "user_admin", "executive", "dealer"].includes(body.data.user.role)) {
            return window.location.replace("{% url 'dashboard' %}");
        }
    } catch (_) {
        return toLogin();
    }
    document.getElementById("auth-guard-style").remove();
    applyFilters();
})();

let prevUrl = null, nextUrl = null, searchTimer = null;
const COLS = 7;

function td(tr, v) {
    const c = document.createElement("td");
    c.textContent = v == null || v === "" ? "-" : v;
    tr.appendChild(c);
    return c;
}

function applySearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 350);
}
function applyFilters() {
    const q = new URLSearchParams({ page: 1 });
    [["f-search", "search"], ["f-type", "device_type"], ["f-alloc", "allocation_status"], ["f-active", "is_active"]]
        .forEach(([id, key]) => { const v = document.getElementById(id).value.trim(); if (v) q.set(key, v); });
    return loadDevices("{% url 'devices_list' %}?" + q.toString());
}
function clearFilters() {
    ["f-search", "f-type", "f-alloc", "f-active"].forEach(id => { document.getElementById(id).value = ""; });
    applyFilters();
}

async function loadDevices(url) {
    if (!url) return;
    const table = document.getElementById("device-table");
    const body = document.getElementById("device-body");
    table.classList.add("is-loading");
    const message = (text) => {
        table.classList.remove("is-loading");
        document.getElementById("result-info").textContent = "";
        body.innerHTML = "";
        const tr = document.createElement("tr");
        const c = document.createElement("td");
        c.colSpan = COLS;
        c.className = "empty-cell";
        c.textContent = text;
        tr.appendChild(c);
        body.appendChild(tr);
    };
    let res;
    try {
        res = await fetch(url, { headers: { "Authorization": "Bearer " + localStorage.getItem("access_token") } });
    } catch (_) { return message("Network error. Please try again."); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) return message("Unable to load devices.");
    const d = json.data;
    prevUrl = d.previous; nextUrl = d.next;
    document.getElementById("pager-prev").disabled = !prevUrl;
    document.getElementById("pager-next").disabled = !nextUrl;
    document.getElementById("pager-info").textContent = d.count + " total";
    if (!d.results.length) return message(url.includes("?") && /[?&](search|device_type|allocation_status|is_active)=/.test(url) ? "No devices match the selected filters. Try clearing them." : "No devices yet.");

    table.classList.remove("is-loading");
    body.innerHTML = "";
    for (const x of d.results) {
        const tr = document.createElement("tr");
        td(tr, x.serial_number);
        td(tr, x.device_type_display || x.device_type);
        td(tr, x.allocation_status_display || x.allocation_status);
        const st = td(tr, "");
        st.textContent = "";
        const b = document.createElement("span");
        b.className = "badge " + (x.is_active ? "badge-green" : "badge-red");
        b.textContent = x.is_active ? "Active" : "Inactive";
        st.appendChild(b);
        td(tr, x.dealer_profile_name);
        td(tr, x.user_profile_name);
        td(tr, new Date(x.created_at).toLocaleString());
        body.appendChild(tr);
    }
    document.getElementById("result-info").textContent = d.results.length + " devices on this page";
}
</script>

{% include "nav/nav.html" %}
<div class="customer-page">
    <div class="page-head">
        <h1>Devices</h1>
    </div>
    <div class="filter-bar">
        <label class="search-label">Search
            <input type="search" id="f-search" placeholder="Serial number..." oninput="applySearch()" autocomplete="off">
        </label>
        <label>Type
            <select id="f-type" onchange="applyFilters()">
                <option value="">All</option>
                <option value="repeater">Repeater</option>
                <option value="transmitter">Transmitter</option>
                <option value="receiver">Receiver</option>
                <option value="gateway">Gateway</option>
            </select>
        </label>
        <label>Allocation
            <select id="f-alloc" onchange="applyFilters()">
                <option value="">All</option>
                <option value="stock">Stock</option>
                <option value="assigned_to_dealer">Assigned to Dealer</option>
                <option value="assigned_to_customer">Assigned to Customer</option>
            </select>
        </label>
        <label>Status
            <select id="f-active" onchange="applyFilters()">
                <option value="">All</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
        </label>
        <button type="button" class="action-btn" onclick="clearFilters()">Clear</button>
    </div>
    <div id="result-info" class="result-info" aria-live="polite"></div>
    <div class="customer-table-wrap">
        <table class="customer-table" id="device-table">
            <thead>
                <tr><th>Serial Number</th><th>Type</th><th>Allocation</th><th>Status</th><th>Dealer</th><th>User</th><th>Created</th></tr>
            </thead>
            <tbody id="device-body"></tbody>
        </table>
    </div>
    <div class="pager">
        <button type="button" id="pager-prev" class="icon-btn" onclick="loadDevices(prevUrl)" title="Previous" aria-label="Previous page" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <span id="pager-info"></span>
        <button type="button" id="pager-next" class="icon-btn" onclick="loadDevices(nextUrl)" title="Next" aria-label="Next page" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
</div>
<style>
.pager { display: flex; justify-content: center; align-items: center; color: #52606d; font-size: .9rem; gap: 12px; margin-top: 12px; }
.icon-btn { border: none; background: none; color: #087f8c; padding: 4px; border-radius: 6px; cursor: pointer; line-height: 0; vertical-align: middle; }
.icon-btn + .icon-btn { margin-left: 6px; }
.icon-btn:hover { background: #e6f4f5; }
.icon-btn:disabled { color: #b8c2cc; cursor: default; background: none; }
.customer-page { max-width: 100%; }
.customer-page h1 { margin: 0; font-size: 1.6rem; color: #1f2933; }
.page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.customer-table-wrap { width: 100%; overflow: auto; max-height: calc(100vh - 210px); background: #fff; border: 1px solid #e3e8ef; border-radius: 8px; scrollbar-width: thin; scrollbar-color: #b8c2cc transparent; }
.customer-table-wrap::-webkit-scrollbar { height: 6px; }
.customer-table-wrap::-webkit-scrollbar-thumb { background: #b8c2cc; border-radius: 3px; }
.customer-table-wrap::-webkit-scrollbar-track { background: transparent; }
.customer-table { width: 100%; border-collapse: collapse; table-layout: auto; }
.customer-table th { position: sticky; top: 0; z-index: 1; text-align: left; background: #087f8c; color: #fff; padding: 10px 12px; white-space: nowrap; font-weight: 600; }
.customer-table td { padding: 10px 12px; border-bottom: 1px solid #eef1f5; vertical-align: top; color: #1f2933; white-space: nowrap; }
.customer-table tbody tr:hover { background: #f6f9fb; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .75rem; font-weight: 600; text-transform: uppercase; background: #eef1f5; color: #52606d; }
.badge-green { background: #e6f6ec; color: #1a7f45; }
.badge-red { background: #fdecec; color: #b42318; }
.customer-page h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(90deg, #087f8c, #5b5bd6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.page-head { padding: 14px 18px; background: linear-gradient(135deg, #e0f7fa, #ede9fe); border-radius: 12px; border: 1px solid #d6e4f0; box-shadow: 0 2px 8px rgba(8,127,140,.10); }
.customer-table-wrap { border: 0; border-radius: 12px; box-shadow: 0 4px 18px rgba(31,41,51,.08); }
.customer-table th { background: linear-gradient(90deg, #087f8c, #5b5bd6); letter-spacing: .02em; }
.customer-table tbody tr:nth-child(even) { background: #f4faff; }
.customer-table tbody tr:hover { background: #e3f4f7; }
.customer-table td { border-bottom: 1px solid #e6eef5; }
.icon-btn:hover { background: #ede9fe; color: #5b5bd6; }
.icon-btn + .icon-btn { color: #1a7f45; }
.icon-btn + .icon-btn:hover { background: #e6f6ec; color: #1a7f45; }
.badge { border-radius: 999px; padding: 3px 10px; }
.badge-green { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #047857; }
.badge-red { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #b91c1c; }
.modal-box .customer-table td { white-space: normal; overflow-wrap: anywhere; }
.modal-box .customer-table tbody tr:nth-child(even) { background: #f4faff; }
.filter-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; margin-bottom: 14px; padding: 14px 18px; background: linear-gradient(135deg, #ffffff, #f4f0ff); border: 1px solid #d6e4f0; border-left: 5px solid #5b5bd6; border-radius: 12px; box-shadow: 0 2px 10px rgba(91,91,214,.10); }
.search-label input { min-width: 260px; cursor: text; }
.result-info { font-size: .82rem; color: #52606d; margin: 0 4px 8px; min-height: 1.1em; }
.customer-table tbody tr[hidden] { display: none; }
.customer-table.is-loading tbody { opacity: .45; transition: opacity .15s; }
.empty-cell { text-align: center; padding: 36px 12px !important; color: #52606d !important; white-space: normal !important; }
.badge-auth-approved { background: #d1fae5; color: #047857; }
.badge-auth-pending, .badge-auth-validating { background: #fef3c7; color: #b45309; }
.badge-auth-expired, .badge-auth-blocked { background: #fee2e2; color: #b91c1c; }
.filter-bar { position: relative; }
.filter-bar::before { content: "Filters"; flex: 0 0 100%; align-self: center; font-weight: 800; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; background: linear-gradient(90deg, #087f8c, #5b5bd6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.filter-bar label { display: flex; flex-direction: column; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5b5bd6; gap: 5px; }
.filter-bar select, .filter-bar input { padding: 8px 12px; border: 1.5px solid #d3d9f5; border-radius: 999px; font-size: .9rem; color: #1f2933; background: #fff; min-width: 150px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.filter-bar select:hover, .filter-bar input:hover { border-color: #5b5bd6; }
.filter-bar select:focus, .filter-bar input:focus { outline: 0; border-color: #5b5bd6; box-shadow: 0 0 0 3px rgba(91,91,214,.18); }
.filter-bar .action-btn { position: absolute; top: 12px; right: 18px; margin: 0; padding: 6px 16px; border-color: #b42318; color: #b42318; background: #fff; }
.filter-bar .action-btn:hover:not(:disabled) { background: linear-gradient(135deg, #ef4444, #b42318); border-color: transparent; color: #fff; }
.action-btn { border: 1px solid #087f8c; background: #fff; color: #087f8c; padding: 4px 10px; border-radius: 999px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s; }
.action-btn:hover:not(:disabled) { background: #087f8c; color: #fff; }
.pager { background: #fff; width: fit-content; margin: 14px auto 0; padding: 4px 14px; border-radius: 999px; box-shadow: 0 2px 8px rgba(31,41,51,.08); font-weight: 600; color: #5b5bd6; }
    .page-head { flex-wrap: wrap; gap: 10px; }
    .modal .customer-table { display: block; overflow-x: auto; }
@media (max-width: 768px) {
    body { padding-left: 0; }
    .page-head { flex-wrap: wrap; gap: 10px; }
}
.badge-grey { background: #eef1f5; color: #52606d; }
</style>
{% endblock %}
