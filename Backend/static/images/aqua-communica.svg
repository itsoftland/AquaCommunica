<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <style>
    .fb { transform-box: fill-box; }
    .wave { animation: wave 5s linear infinite; }
    .wave2 { animation: wave 7s linear infinite reverse; }
    @keyframes wave { to { transform: translateX(-140px); } }
    .fill { animation: fill 12s linear infinite; }
    @keyframes fill { 0% { transform: translateY(100px); } 80%, 92% { transform: translateY(-40px); } 100% { transform: translateY(100px); } }
    .gauge { transform-box: fill-box; transform-origin: bottom center; animation: gauge 12s linear infinite; }
    @keyframes gauge { 0% { transform: scaleY(.1); } 80%, 92% { transform: scaleY(1); } 100% { transform: scaleY(.1); } }
    .pct { opacity: 0; animation: pct 12s steps(1, end) infinite; }
    .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; } .p4 { animation-name: p4; } .p5 { animation-name: p5; }
    @keyframes p1 { 0% { opacity: 1; } 16% { opacity: 0; } 92% { opacity: 1; } }
    @keyframes p2 { 0% { opacity: 0; } 16% { opacity: 1; } 32% { opacity: 0; } }
    @keyframes p3 { 0% { opacity: 0; } 32% { opacity: 1; } 48% { opacity: 0; } }
    @keyframes p4 { 0% { opacity: 0; } 48% { opacity: 1; } 64% { opacity: 0; } }
    @keyframes p5 { 0% { opacity: 0; } 64% { opacity: 1; } 92% { opacity: 0; } }
    .sway { animation: sway 4s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    .flow { animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .link { animation: flow 1.6s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse1, .pulse2, .pulse3 { animation: pulse 2.4s ease-in-out infinite; }
    .pulse2 { animation-delay: .3s; } .pulse3 { animation-delay: .6s; }
    @keyframes pulse { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .bubble { transform-box: fill-box; animation: rise 4s ease-in infinite; }
    .b2 { animation-delay: 1.3s; } .b3 { animation-delay: 2.6s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .5; } 100% { transform: translateY(-50px); opacity: 0; } }
    .drop { transform-box: fill-box; animation: drop 3.5s ease-in infinite; }
    .d2 { animation-delay: 1.1s; } .d3 { animation-delay: 2.2s; }
    @keyframes drop { 0% { transform: translateY(-14px); opacity: 0; } 20% { opacity: .85; } 100% { transform: translateY(26px); opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: bar 4s ease-in-out infinite alternate; }
    .bar2 { animation-duration: 5s; }
    @keyframes bar { from { transform: scaleX(.55); } to { transform: scaleX(1); } }
    .float { animation: bob 3s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .p5 { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb4c4"/>
      <stop offset="0.55" stop-color="#087f8c"/>
      <stop offset="1" stop-color="#033f4a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe3ee"/>
      <stop offset="1" stop-color="#1fa6b8"/>
    </linearGradient>
    <clipPath id="overhead"><rect x="260" y="170" width="280" height="190" rx="26"/></clipPath>
    <clipPath id="sump"><rect x="110" y="610" width="230" height="130" rx="18"/></clipPath>
  </defs>

  <rect width="800" height="900" fill="url(#bg)"/>

  <!-- soft background circles -->
  <g fill="#fff" opacity="0.06">
    <circle cx="690" cy="170" r="150"/>
    <circle cx="90" cy="360" r="110"/>
  </g>

  <!-- wifi / signal from tank sensor -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5">
    <path class="pulse1" d="M610 112 Q640 82 670 112"/>
    <path class="pulse2" d="M592 94 Q640 46 688 94"/>
    <path class="pulse3" d="M574 76 Q640 10 706 76"/>
  </g>
  <circle class="blink" cx="640" cy="130" r="7" fill="#fff"/>
  <path d="M540 215 L640 140" stroke="#fff" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round" class="link"/>

  <!-- overhead tank -->
  <rect x="255" y="165" width="290" height="200" rx="30" fill="#e9fbfd"/>
  <rect x="260" y="170" width="280" height="190" rx="26" fill="#0b5f6a"/>
  <g clip-path="url(#overhead)">
    <g class="fill">
      <rect x="260" y="245" width="280" height="140" fill="url(#water)"/>
      <path class="wave" d="M190 245 Q225 228 260 245 T330 245 T400 245 T470 245 T540 245 T610 245 T680 245 V262 H190 Z" fill="#a4f0f7" opacity="0.7"/>
      <path class="wave2" d="M190 252 Q225 240 260 252 T330 252 T400 252 T470 252 T540 252 T610 252 T680 252 V270 H190 Z" fill="#7fe3ee" opacity="0.5"/>
      <circle class="bubble" cx="320" cy="340" r="7" fill="#fff"/>
      <circle class="bubble b2" cx="470" cy="345" r="5" fill="#fff"/>
      <circle class="bubble b3" cx="410" cy="335" r="4" fill="#fff"/>
    </g>
  </g>
  <!-- tank lid + level gauge -->
  <rect x="330" y="150" width="140" height="22" rx="10" fill="#c8f1f5"/>
  <rect x="505" y="190" width="14" height="150" rx="7" fill="#fff" opacity="0.25"/>
  <rect class="gauge" x="505" y="190" width="14" height="150" rx="7" fill="#ffd166"/>
<text class="pct p1" x="400" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">15%</text>
  <text class="pct p2" x="400" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">30%</text>
  <text class="pct p3" x="400" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">45%</text>
  <text class="pct p4" x="400" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">60%</text>
  <text class="pct p5" x="400" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">80%</text>

  <!-- tank stand -->
  <g stroke="#e9fbfd" stroke-width="12" stroke-linecap="round">
    <line x1="290" y1="370" x2="270" y2="560"/>
    <line x1="510" y1="370" x2="530" y2="560"/>
  </g>
  <g stroke="#e9fbfd" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round">
    <line x1="283" y1="440" x2="517" y2="500"/>
    <line x1="517" y1="440" x2="283" y2="500"/>
  </g>

  <!-- supply pipe: sump -> pump -> overhead tank -->
  <path d="M340 690 H430 V650 H640 V285 H545" fill="none" stroke="#c8f1f5" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M340 690 H430 V650 H640 V285 H545" fill="none" stroke="#087f8c" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.9" class="flow"/>

  <!-- pump -->
  <g transform="translate(470 650)">
    <circle r="36" fill="#e9fbfd"/>
    <circle r="26" fill="#087f8c"/>
    <g class="spin" stroke="#fff" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
    </g>
    <circle r="5" fill="#ffd166"/>
  </g>

  <!-- valve on outlet -->
  <g transform="translate(640 470)">
    <rect x="-20" y="-16" width="40" height="32" rx="8" fill="#ffd166"/>
    <line x1="0" y1="-16" x2="0" y2="-34" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
    <rect x="-16" y="-42" width="32" height="10" rx="5" fill="#ff6b6b"/>
  </g>

  <!-- outlet pipe to the building -->
  <path d="M400 365 V420" stroke="#c8f1f5" stroke-width="12" stroke-linecap="round"/>

  <!-- sump / underground tank -->
  <rect x="105" y="605" width="240" height="140" rx="22" fill="#e9fbfd"/>
  <rect x="110" y="610" width="230" height="130" rx="18" fill="#0b5f6a"/>
  <g clip-path="url(#sump)">
    <rect x="110" y="660" width="230" height="90" fill="url(#water)"/>
    <path class="wave" d="M40 660 Q75 646 110 660 T180 660 T250 660 T320 660 T390 660 T460 660 T530 660 V676 H40 Z" fill="#a4f0f7" opacity="0.7"/>
  </g>
  <!-- float sensor in sump -->
  <g class="float">
    <circle cx="225" cy="660" r="9" fill="#ff6b6b"/>
    <line x1="225" y1="651" x2="225" y2="625" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- ground -->
  <path d="M0 800 Q200 770 400 795 T800 785 V900 H0 Z" fill="#022d36"/>
  <rect x="0" y="560" width="800" height="0" fill="none"/>

  <!-- dashboard card -->
  <g transform="translate(70 120)">
    <rect width="150" height="96" rx="14" fill="#fff" opacity="0.92"/>
    <rect x="16" y="18" width="60" height="8" rx="4" fill="#087f8c" opacity="0.7"/>
    <rect x="16" y="40" width="118" height="8" rx="4" fill="#cfe9ec"/>
    <rect class="bar" x="16" y="40" width="85" height="8" rx="4" fill="#087f8c"/>
    <rect x="16" y="62" width="118" height="8" rx="4" fill="#cfe9ec"/>
    <rect class="bar bar2" x="16" y="62" width="48" height="8" rx="4" fill="#ffd166"/>
  </g>
  <path d="M220 170 L255 215" stroke="#fff" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round" class="link"/>

  <!-- droplets -->
  <g fill="#c8f1f5" opacity="0.85">
    <path class="drop" d="M110 420 q-12 18 0 28 q12 -10 0 -28z"/>
    <path class="drop d2" d="M700 560 q-9 14 0 22 q9 -8 0 -22z"/>
    <path class="drop d3" d="M60 520 q-8 12 0 19 q8 -7 0 -19z"/>
  </g>

</svg>
