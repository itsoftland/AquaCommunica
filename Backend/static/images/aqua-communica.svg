<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48cae4"/>
      <stop offset="0.5" stop-color="#0077b6"/>
      <stop offset="1" stop-color="#03045e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#caf0f8"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="tank"><rect x="440" y="250" width="190" height="170" rx="24"/></clipPath>
    <clipPath id="screen"><rect x="118" y="318" width="164" height="270" rx="16"/></clipPath>
  </defs>

  <rect width="800" height="900" fill="url(#bg)"/>

  <!-- soft light circles -->
  <g fill="#fff">
    <circle cx="680" cy="150" r="170" opacity=".07"/>
    <circle cx="90" cy="230" r="120" opacity=".06"/>
    <circle cx="420" cy="90" r="60" opacity=".05"/>
  </g>

  <!-- big water drop emblem -->
  <path d="M400 70 C400 70 330 150 330 200 a70 70 0 0 0 140 0 C470 150 400 70 400 70z" fill="url(#glass)" stroke="#fff" stroke-opacity=".7" stroke-width="4"/>
  <path d="M362 200 a38 38 0 0 0 26 36" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="6" stroke-linecap="round"/>

  <!-- building -->
  <rect x="520" y="440" width="220" height="360" rx="6" fill="#023e8a"/>
  <rect x="520" y="440" width="220" height="14" fill="#f0faff"/>
  <g fill="#90e0ef" opacity=".85">
    <rect x="545" y="480" width="40" height="46" rx="5"/><rect x="605" y="480" width="40" height="46" rx="5"/><rect x="665" y="480" width="40" height="46" rx="5"/>
    <rect x="545" y="560" width="40" height="46" rx="5"/><rect x="605" y="560" width="40" height="46" rx="5" fill="#ffd166"/><rect x="665" y="560" width="40" height="46" rx="5"/>
    <rect x="545" y="640" width="40" height="46" rx="5"/><rect x="605" y="640" width="40" height="46" rx="5"/><rect x="665" y="640" width="40" height="46" rx="5" fill="#ffd166"/>
  </g>
  <rect x="598" y="725" width="54" height="75" rx="6" fill="#03045e"/>

  <!-- rooftop tank on stand -->
  <g stroke="#f0faff" stroke-width="10" stroke-linecap="round">
    <line x1="470" y1="425" x2="470" y2="440"/><line x1="600" y1="425" x2="600" y2="440"/>
  </g>
  <rect x="435" y="245" width="200" height="180" rx="28" fill="#f0faff"/>
  <rect x="440" y="250" width="190" height="170" rx="24" fill="#023e8a"/>
  <g clip-path="url(#tank)">
    <rect x="440" y="302" width="190" height="120" fill="url(#water)"/>
    <path d="M400 302 Q430 290 460 302 T520 302 T580 302 T640 302 V318 H400 Z" fill="#e0f7fc" opacity=".65"/>
  </g>
  <rect x="490" y="232" width="90" height="20" rx="9" fill="#d6f1fa"/>
  <text x="535" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">75%</text>

  <!-- connecting pipe from tank to building -->
  <path d="M635 340 H700 V440" fill="none" stroke="#d6f1fa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wifi signal above tank -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5" opacity=".85">
    <path d="M500 178 Q535 148 570 178"/><path d="M482 160 Q535 112 588 160"/>
  </g>
  <circle cx="535" cy="196" r="7" fill="#fff"/>

  <!-- phone with level monitor -->
  <g>
    <rect x="100" y="300" width="200" height="306" rx="30" fill="#f0faff"/>
    <rect x="118" y="318" width="164" height="270" rx="16" fill="#f7fcff"/>
    <g clip-path="url(#screen)">
      <rect x="118" y="318" width="164" height="48" fill="#0077b6"/>
      <rect x="134" y="334" width="70" height="8" rx="4" fill="#fff" opacity=".85"/>
      <circle cx="200" cy="448" r="52" fill="none" stroke="#d6f1fa" stroke-width="14"/>
      <circle cx="200" cy="448" r="52" fill="none" stroke="#0077b6" stroke-width="14" stroke-linecap="round" stroke-dasharray="245 327" transform="rotate(-90 200 448)"/>
      <text x="200" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#023e8a">75%</text>
      <rect x="134" y="520" width="132" height="8" rx="4" fill="#d6f1fa"/><rect x="134" y="520" width="92" height="8" rx="4" fill="#0077b6"/>
      <rect x="134" y="542" width="132" height="8" rx="4" fill="#d6f1fa"/><rect x="134" y="542" width="52" height="8" rx="4" fill="#ffd166"/>
    </g>
  </g>
  <path d="M300 420 C360 420 380 340 435 340" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round"/>

  <!-- waves at the bottom -->
  <path d="M0 790 Q100 760 200 790 T400 790 T600 790 T800 790 V900 H0 Z" fill="#0a5a9c" opacity=".7"/>
  <path d="M0 825 Q100 795 200 825 T400 825 T600 825 T800 825 V900 H0 Z" fill="#05407a" opacity=".85"/>
  <path d="M0 860 Q100 835 200 860 T400 860 T600 860 T800 860 V900 H0 Z" fill="#03045e"/>
</svg>
